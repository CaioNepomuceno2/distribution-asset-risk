# Recorte: Energisa Mato Grosso (EMT)
distribuidora:
  sigla: EMT
  cod_aneel: 405
  nome: Energisa Mato Grosso
  nome_curto: Energisa MT

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  reports: reports
  app_data: app/data
  malha_ibge: data/ref/mt_ibge.geojson   # malha do IBGE, UF 51
  catalogo: configs/intervencoes.yaml

interrupcoes:
  anos: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]

# Anos do backtest, da previsão e das contas de compensação (os valores publicados para MT).
janelas:
  anos_teste: [2023, 2024, 2025]
  ano_previsao: 2026
  anos_compensacao: [2022, 2023, 2024, 2025]
  ano_inicio_painel: 2019
  ano_inicio_pesos_conjunto: 2022
  ano_inicio_shap: 2023

# INMET: UF das estações. Só MT foi testado; sem esta chave, build_clima.py e experimento_clima.py recusam rodar.
clima:
  uf: MT

# Efeito medido pelo automation-impact (fração do CHI do alimentador evitada ao ganhar religador, com IC 95%),
# usado por scripts/sensibilidade_eficacias.py.
eficacias_medidas:
  religador:
    medido: 0.166
    medido_ic_inferior: 0.075
    medido_ic_superior: 0.248

# MT: o painel usa todos os circuitos do cadastro (docs/dados.md)
qualidade:
  excluir_circuitos_vazios: false

bdgd:
  # snapshots de 31/12 de cada ano (id do item no ArcGIS Hub da ANEEL)
  snapshots:
    2018: b6900e72a13946b6a2dc015aaf6d6ccd
    2019: f15e84cabd564d31869c3af5d7855376
    2020: bc9ef518725a416a99e08c99e2d979d1
    2021: 13d6ff510a4c4a7fac64f0e119beb245
    2022: 94a1b3fa56e3442fb8a2b3a8a3dc4df8
    2023: f6095aa7e5c64119ab46e3efe46b77d5
    2024: 8fed7443387d4d04a361e7f4d1edea64
    2025: 02a120db1b5149709f8d371c21635adc

modelo:
  # Clima do INMET como feature. Desligado: o experimento pré-registrado (docs/preregistro_clima.md,
  # reports/experimento_clima.json) mostrou que as colunas de clima pioram o backtest. Para ligar, rode
  # scripts/build_clima.py e troque para true; ter o arquivo em data/interim não liga mais o clima sozinho.
  usar_clima: false
