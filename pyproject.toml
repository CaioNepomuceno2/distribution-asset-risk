[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridrisk"
version = "0.1.0"
description = "Gestão de ativos baseada em risco para redes de distribuição com dados abertos da ANEEL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "pandas>=2.2",
  "pyarrow>=16",
  "pyogrio>=0.9",
  "geopandas>=1.0",
  "requests>=2.32",
  "pyyaml>=6",
  "lightgbm>=4.5",
  "scikit-learn>=1.5",
  "shap>=0.46",
  "pulp>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.9"]
app = ["streamlit>=1.39", "plotly>=5.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
